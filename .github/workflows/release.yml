name: Release

on:
  push:
    tags:
      - "macos-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # TraeBar 独立发布：打 macos-v* tag 时产出通用（arm64+x86_64）二进制并创建 Release。
  # 版本号 = tag（如 macos-v1.0.0），与 Windows 版（main 分支的 v* tag）完全独立。
  #
  # 打包方式（修复 #50「zip 解压后没有安装包」）：
  #   旧做法把裸的 Mach-O 可执行文件直接压进 zip，解压出来既不是 .app、也没法双击安装；
  #   现在组装标准的 TraeBar.app（Contents/MacOS + Contents/Info.plist）、做临时签名，
  #   再用 ditto 打包（保留 bundle 元数据），解压后可直接拖进「应用程序」。
  macos-publish:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TraeBar (Release, universal)
        run: |
          cd macos
          swift build -c release --arch arm64 --arch x86_64
          ls -la .build/apple/Products/release/ | head

      - name: Assemble TraeBar.app
        run: |
          set -e
          cd macos
          VER="${GITHUB_REF_NAME#macos-v}"
          rm -rf TraeBar.app
          mkdir -p TraeBar.app/Contents/MacOS TraeBar.app/Contents/Resources
          cp .build/apple/Products/release/TraeBar TraeBar.app/Contents/MacOS/TraeBar
          cp Info.plist TraeBar.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" TraeBar.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" TraeBar.app/Contents/Info.plist
          # 临时签名：不加这步 Gatekeeper 会报「已损坏」；临时签名后降为「未验证开发者」，右键→打开即可放行
          codesign --force --sign - TraeBar.app
          codesign --verify --verbose TraeBar.app
          /usr/libexec/PlistBuddy -c "Print" TraeBar.app/Contents/Info.plist
          find TraeBar.app -print

      - name: Package TraeBar
        run: |
          set -e
          cd macos
          rm -f TraeBar-macos.zip
          # ditto 打包：保留 .app 的 bundle 结构与扩展属性（普通 zip 会丢元数据，解压后可能不被识别为应用）
          ditto -c -k --sequesterRsrc --keepParent TraeBar.app TraeBar-macos.zip
          ls -la TraeBar-macos.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TraeBar ${{ github.ref_name }}"
          body: |
            TraeBar ${{ github.ref_name }} — macOS 菜单栏版多账号自动签到（arm64 + x86_64 通用二进制）

            ## 安装
            1. 下载 `TraeBar-macos.zip`，解压得到 **TraeBar.app**；
            2. 把 TraeBar.app 拖进「应用程序」文件夹；
            3. 首次打开：在「应用程序」里 **右键 → 打开**（或「系统设置 → 隐私与安全性 → 仍要打开」）。
               本包未做 Apple 公证，Gatekeeper 会拦一次，属正常现象。
               若提示「已损坏，无法打开」，在终端执行一次即可解除隔离标记：
               `xattr -dr com.apple.quarantine /Applications/TraeBar.app`

            - 最低系统版本：macOS 13.0（与 Package.swift 的 platforms 一致）
          files: macos/TraeBar-macos.zip
          generate_release_notes: true
